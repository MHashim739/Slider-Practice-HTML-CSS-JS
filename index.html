<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider">

  <div class="slides">
    <img src="https://m.media-amazon.com/images/I/71QcgptqadL._SX3000_.jpg" class="slide active">
    <img src="https://m.media-amazon.com/images/I/619geyiQI5L._SX3000_.jpg" class="slide">
    <img src="https://m.media-amazon.com/images/I/61Yx5-N155L._SX3000_.jpg" class="slide">
    <img src="https://m.media-amazon.com/images/I/71qcoYgEhzL._SX3000_.jpg" class="slide">
  </div>

  <button class="prev" onclick="prevSlide()">&#10094;</button>
  <button class="next" onclick="nextSlide()">&#10095;</button>

</div>

<script src="app.js"></script>
</body>
</html>
